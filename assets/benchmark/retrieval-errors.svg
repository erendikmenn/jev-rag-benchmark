<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <style>
    .t { font-family: Arial, Helvetica, sans-serif; fill: #111; }
    .muted { fill: #555; }
    .grid { stroke: #d0d0d0; stroke-width: 1.5; stroke-dasharray: 6 8; }
  </style>
  <rect width="1600" height="900" fill="#fff"/>
  <g class="t">
    <text x="70" y="66" font-size="20" font-weight="700">XQUAD-TR • 1,044 QUESTIONS</text>
    <text x="70" y="122" font-size="44" font-weight="700">Retrieval errors in the top five contexts</text>
    <text x="70" y="158" class="muted" font-size="20">How often the gold passage is missing after each retrieval stage</text>

    <text x="70" y="218" font-size="16" font-weight="700">Y AXIS — RETRIEVAL PIPELINE</text>
    <g transform="translate(70,240)">
      <line x1="370" y1="0" x2="370" y2="390" stroke="#111" stroke-width="2"/>
      <line x1="370" y1="390" x2="1370" y2="390" stroke="#111" stroke-width="2"/>
      <line x1="647" y1="0" x2="647" y2="390" class="grid"/>
      <line x1="924" y1="0" x2="924" y2="390" class="grid"/>
      <line x1="1201" y1="0" x2="1201" y2="390" class="grid"/>

      <text x="0" y="58" font-size="23" font-weight="700">Classic BM25</text>
      <text x="0" y="87" class="muted" font-size="18">Recall@5: 93.77%</text>
      <rect x="370" y="18" width="900" height="78" fill="#111"/>
      <text x="1292" y="68" font-size="30" font-weight="700">65</text>

      <text x="0" y="188" font-size="23" font-weight="700">Hybrid retrieval</text>
      <text x="0" y="217" class="muted" font-size="18">Recall@5: 97.61%</text>
      <rect x="370" y="148" width="346" height="78" fill="#777"/>
      <text x="738" y="198" font-size="30" font-weight="700">25</text>

      <text x="0" y="318" font-size="23" font-weight="700">Hybrid + Jev</text>
      <text x="0" y="347" class="muted" font-size="18">Recall@5: 99.43%</text>
      <rect x="370" y="278" width="83" height="78" fill="#fff" stroke="#111" stroke-width="4"/>
      <text x="475" y="328" font-size="30" font-weight="700">6</text>

      <text x="370" y="424" class="muted" text-anchor="middle" font-size="16">0</text>
      <text x="647" y="424" class="muted" text-anchor="middle" font-size="16">20</text>
      <text x="924" y="424" class="muted" text-anchor="middle" font-size="16">40</text>
      <text x="1201" y="424" class="muted" text-anchor="middle" font-size="16">60</text>
      <text x="870" y="462" text-anchor="middle" font-size="16" font-weight="700">X AXIS — QUESTIONS WITH GOLD PASSAGE MISSING FROM TOP 5 (LOWER IS BETTER)</text>
    </g>

    <g transform="translate(70,735)">
      <rect width="1460" height="92" fill="#f4f4f4" stroke="#111" stroke-width="2"/>
      <text x="26" y="39" font-size="20" font-weight="700">KEY RESULT</text>
      <text x="160" y="39" font-size="27" font-weight="700">65 → 6 errors</text>
      <text x="350" y="39" font-size="20">90.8% fewer retrieval errors than classic BM25.</text>
      <text x="26" y="70" class="muted" font-size="17">On the same hybrid candidate pool, Jev recovered 19 of the 25 questions missed by the raw order.</text>
    </g>

    <text x="70" y="874" class="muted" font-size="15">github.com/erendikmenn/jev-rag-benchmark</text>
    <text x="1530" y="874" text-anchor="end" class="muted" font-size="15">Google XQuAD • Turkish split</text>
  </g>
</svg>
