run:
  seed: 20260919
  concurrency: 1
  cache: warm
  max_budget_usd: 0.0
  latency_repetitions: 3
  deduplicate_queries: false

retrieval:
  candidate_k: 20
  context_k: 5
  context_char_budget: 6000
  backend: bm25
  embedding:
    provider: openrouter
    model: baai/bge-m3
    batch_size: 64
    timeout_seconds: 120
    max_retries: 2
    input_usd_per_million_tokens: 0.01
    price_verified_on: "2026-09-20"
  hybrid:
    rrf_k: 60
    bm25_weight: 1.0
    dense_weight: 1.0
    source_k: 100

generator:
  provider: openrouter
  model: qwen/qwen3.7-flash
  temperature: 0.0
  timeout_seconds: 60
  max_output_tokens: 128
  max_retries: 2
  input_usd_per_million_tokens: 0.03
  output_usd_per_million_tokens: 0.13
  price_verified_on: "2026-09-19"
  prompt_version: answer-v3

rerankers:
  cross_encoder:
    model: cross-encoder/mmarco-mMiniLMv2-L12-H384-v1
    device: cpu
  jev:
    provider: openrouter
    model: typesafe/jev-1.13
    threshold: 0.50
    threshold_source: uncalibrated
    timeout_seconds: 60
    max_retries: 2
    max_concurrency: 12
    prompt_version: relevance-noul-v1
    input_usd_per_million_tokens: 0.042
    price_verified_on: "2026-09-19"
    evidence_router:
      relevant_min: 0.45
      evidence_min: 0.55
      contradiction_min: 0.70
      injection_max: 0.70
  small_llm:
    provider: openrouter
    model: qwen/qwen3.7-flash

policies:
  no_document: original_top_k
  jev_error: original_order
  answer_abstention_text: "Kaynaklarda bu soruyu yanıtlamak için yeterli kanıt yok."

verification:
  enabled_branches: [V]
  auto_accept_confidence: 0.80
  regenerate_once: true
  prompt_version: citation-check-v1

datasets:
  scifact:
    version: beir-scifact-1.0.0
    split: test
  xquad_en:
    version: google-deepmind/xquad@master
    language: en
  xquad_tr:
    version: google-deepmind/xquad@master
    language: tr
