[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev-rag-benchmark"
version = "0.1.0"
description = "Reproducible baseline/cross-encoder/Jev RAG benchmark"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "ErenAILab" }]
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28.1,<0.29",
  "numpy>=2.2,<3",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0.2,<7",
  "typer>=0.16,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
llamaindex = [
  "llama-index-core>=0.14.24,<0.15",
  "llama-index-embeddings-ollama>=0.8,<0.9",
  "llama-index-llms-ollama>=0.9,<0.10",
  "llama-index-retrievers-bm25>=0.7,<0.8",
]
cross-encoder = ["sentence-transformers>=5.1,<6"]
dev = ["pytest>=8.4,<9", "pytest-cov>=6.2,<7", "ruff>=0.12,<0.13"]

[project.scripts]
jev-rag = "jev_rag_benchmark.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_rag_benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
